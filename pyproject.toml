[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roost"
dynamic = ["version"]
description = "A self-hosted chat app for OpenAI-compatible model servers"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5", "cryptography==50.0.2", "pypdf==6.21.4"]

[tool.setuptools.dynamic]
version = { attr = "roost.__version__" }

[tool.setuptools.packages.find]
include = ["roost*"]

[tool.setuptools.package-data]
roost = ["static/*"]
