[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roost-hermes"
dynamic = ["version"]
description = "An owner-only web app for chatting with a Hermes agent"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.4", "cryptography==50.0.2"]

[tool.setuptools.dynamic]
version = { attr = "roost.__version__" }

[tool.setuptools.packages.find]
include = ["roost*"]

[tool.setuptools.package-data]
roost = ["static/*"]
"roost.hermes_plugin" = ["plugin.yaml"]
