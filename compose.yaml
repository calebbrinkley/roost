services:
  roost:
    build: .
    user: "${ROOST_UID:?Set ROOST_UID to your user ID}:${ROOST_GID:?Set ROOST_GID to your group ID}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${ROOST_PORT:-8787}:8787"
    environment:
      ROOST_PUBLIC_ORIGIN: "${ROOST_PUBLIC_ORIGIN:?Set your private HTTPS browser origin}"
      ROOST_MODEL_URL: "${ROOST_MODEL_URL:-}"
      ROOST_PUSH_SUBJECT: "${ROOST_PUSH_SUBJECT:-}"
      ROOST_MODEL_KEY_FILE: /run/secrets/model_key
      ROOST_STATE_DIR: /var/lib/roost
      ROOST_REVISION: "${ROOST_REVISION:-}"
      ROOST_TRUST_FORWARDED: "${ROOST_TRUST_FORWARDED:-0}"
      ROOST_ADMISSION: "${ROOST_ADMISSION:-1}"
    volumes:
      - type: bind
        source: "${ROOST_STATE_PATH:?Set an absolute private state directory}"
        target: /var/lib/roost
        bind:
          create_host_path: false
    secrets: [model_key]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  model_key:
    file: "${ROOST_MODEL_KEY_SOURCE:?Set an absolute path to a model API key file (empty if unused)}"
