services:
  roost:
    build: .
    user: "${ROOST_UID:?Set ROOST_UID to your user ID}:${ROOST_GID:?Set ROOST_GID to your group ID}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${ROOST_PORT:-8787}:8787"
    environment:
      ROOST_PUBLIC_ORIGIN: "${ROOST_PUBLIC_ORIGIN:?Set your private HTTPS browser origin}"
      ROOST_HERMES_URL: "${ROOST_HERMES_URL:?Set a dashboard URL reachable from the container}"
      ROOST_HERMES_USERNAME: "${ROOST_HERMES_USERNAME:?Set your dashboard username}"
      ROOST_PUSH_SUBJECT: "${ROOST_PUSH_SUBJECT:-}"
      ROOST_HERMES_PASSWORD_FILE: /run/secrets/hermes_password
      ROOST_STATE_DIR: /var/lib/roost
      ROOST_REVISION: "${ROOST_REVISION:-}"
      ROOST_TRUST_FORWARDED: "${ROOST_TRUST_FORWARDED:-0}"
    volumes:
      - type: bind
        source: "${ROOST_STATE_PATH:?Set an absolute private state directory}"
        target: /var/lib/roost
        bind:
          create_host_path: false
    secrets: [hermes_password]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  hermes_password:
    file: "${ROOST_HERMES_PASSWORD_SOURCE:?Set an absolute path to your private dashboard password file}"
