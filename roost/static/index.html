<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="Roost, a place to talk with Wren.">
  <link rel="icon" href="/icon.svg?v=forest-green" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <title>Roost</title>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-icon">R</div>
      <button class="theme-toggle login-theme" type="button" data-theme-toggle></button>
      <h1>Roost</h1>
      <p>Messages with Wren, all in one place.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <nav class="segmented desktop-only" aria-label="Sections">
          <button id="nav-messages" class="segment active" type="button">Messages</button>
          <button id="nav-jobs" class="segment" type="button">Jobs</button>
        </nav>
        <div class="mobile-list-heading mobile-only">
          <h1 id="mobile-list-title">Messages</h1>
          <button id="top-action" class="icon-button" type="button" aria-label="New conversation" title="New conversation">✎</button>
        </div>
      </div>
      <div id="sidebar-search" class="search-wrap">
        <label class="sr-only" for="search">Search conversations</label>
        <input id="search" type="search" placeholder="Search conversations" autocomplete="off">
      </div>
      <div id="conversation-list" class="conversation-list" aria-label="Conversations"></div>
      <button id="more-conversations" class="more-button hidden" type="button">Load more</button>
      <div id="sidebar-jobs-list" class="job-sidebar-list hidden" aria-label="Scheduled jobs"></div>
      <div class="sidebar-footer"><button id="logout" class="text-button" type="button">Sign out</button><button class="theme-toggle" type="button" data-theme-toggle></button></div>
    </aside>

    <main class="main">
      <div id="notice" class="notice hidden" role="status"></div>

      <section id="messages-view" class="messages-view">
        <header class="chat-header">
          <button id="back-to-list" class="back-button mobile-only" type="button" aria-label="Back to Messages">‹</button>
          <div class="chat-avatar">W</div>
          <div class="chat-heading"><strong>Wren</strong><small id="chat-title">Your conversation</small></div>
          <div class="chat-actions">
            <span id="origin-badge" class="source-tag hidden"></span>
            <span id="presence" class="presence desktop-only"></span>
            <button class="theme-toggle theme-icon-only mobile-only" type="button" data-theme-toggle></button>
          </div>
        </header>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <form id="composer" class="composer">
          <button id="new-from-chat" class="plus-button" type="button" aria-label="New conversation" title="New conversation">+</button>
          <label class="sr-only" for="message">Message Wren</label>
          <textarea id="message" rows="1" placeholder="Message Wren" maxlength="16000" required></textarea>
          <button id="voice-button" class="mic-button" type="button" disabled aria-label="Voice messages are coming later" title="Voice messages are coming later">🎤</button>
          <button id="send" class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
      </section>

      <section id="jobs-view" class="jobs-view hidden">
        <header class="jobs-header">
          <button id="back-to-jobs" class="back-button mobile-only" type="button" aria-label="Back to Jobs">‹</button>
          <div class="jobs-heading"><strong id="job-detail-title">Jobs</strong><small id="job-detail-subtitle">Scheduled work with Wren</small></div>
          <div class="jobs-actions"><button class="theme-toggle theme-icon-only mobile-only" type="button" data-theme-toggle></button><button id="new-job" class="icon-button desktop-only" type="button" aria-label="New job" title="New job">+</button></div>
        </header>
        <div id="job-detail" class="job-detail"></div>
        <div id="job-detail-actions" class="job-detail-actions hidden">
          <button id="run-selected-job" class="secondary" type="button">Run now</button>
          <button id="edit-selected-job" class="primary" type="button">Edit job</button>
        </div>
      </section>
    </main>

    <nav id="mobile-tabbar" class="mobile-tabbar mobile-only" aria-label="Sections">
      <button id="mobile-nav-messages" class="tab active" type="button"><span aria-hidden="true">▤</span>Messages</button>
      <button id="mobile-nav-jobs" class="tab" type="button"><span aria-hidden="true">◷</span>Jobs</button>
    </nav>
  </div>

  <dialog id="job-dialog" class="job-dialog">
    <form id="job-form">
      <div class="dialog-heading"><h2 id="job-dialog-title">New job</h2><button id="close-dialog" class="icon-button" type="button" aria-label="Close">×</button></div>
      <label for="job-name">Name</label><input id="job-name" maxlength="500" required placeholder="Morning briefing">
      <label for="job-prompt">What should Wren do?</label><textarea id="job-prompt" rows="5" maxlength="16000" required placeholder="Give me a clear overview of today's priorities."></textarea>
      <label for="job-schedule">Schedule</label><input id="job-schedule" maxlength="500" required placeholder="0 8 * * *"><p id="job-schedule-preview" class="field-help">Example: 0 8 * * * runs daily at 8:00.</p>
      <label for="job-deliver">Delivery</label><input id="job-deliver" maxlength="500" value="local" required><p class="field-help">“local” saves the result in Hermes.</p>
      <div id="job-management" class="job-management hidden"><button id="delete-job" class="danger" type="button">Delete job</button></div>
      <div class="dialog-actions"><button id="cancel-job" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Save</button></div>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
