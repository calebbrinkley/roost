<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Roost, a place to talk with your agent.">
  <link rel="icon" href="/icon.svg?v=forest-green" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/theme.js"></script>
  <link rel="preload" href="/SpaceGrotesk-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <title>Roost</title>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-icon">R</div>
      <h1>Roost</h1>
      <p data-agent-text="Messages with {agent}, all in one place.">Messages with your agent, all in one place.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <div id="notice" class="notice hidden" role="status"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <nav class="segmented desktop-only" aria-label="Sections">
          <button id="nav-messages" class="segment active" type="button">Messages</button>
          <button id="nav-jobs" class="segment" type="button">Jobs</button>
        </nav>
        <button id="nav-settings" class="icon-button settings-button desktop-only" type="button" aria-label="Settings" title="Settings"></button>
        <div class="mobile-list-heading mobile-only">
          <h1 id="mobile-list-title">Messages</h1>
          <div class="mobile-list-actions">
            <button id="mobile-nav-settings" class="icon-button settings-button" type="button" aria-label="Settings" title="Settings"></button>
            <button id="top-action" class="icon-button" type="button" aria-label="New conversation" title="New conversation"></button>
          </div>
        </div>
      </div>
      <div id="sidebar-search" class="search-wrap">
        <label id="search-label" class="sr-only" for="search">Search conversations</label>
        <input id="search" type="search" placeholder="Search conversations" autocomplete="off">
        <button id="sidebar-new" class="icon-button desktop-only" type="button" aria-label="New conversation" title="New conversation">+</button>
      </div>
      <div id="conversation-list" class="conversation-list" aria-label="Conversations"></div>
      <button id="more-conversations" class="more-button hidden" type="button">Load more</button>
      <div id="sidebar-jobs-list" class="job-sidebar-list hidden" aria-label="Scheduled jobs"></div>
      <div id="sidebar-settings-list" class="job-sidebar-list hidden" aria-label="Settings"></div>
      <div class="sidebar-footer"><button id="logout" class="text-button" type="button">Sign out</button><button class="theme-toggle" type="button" data-theme-toggle></button></div>
    </aside>

    <main class="main">

      <section id="messages-view" class="messages-view">
        <header class="chat-header">
          <button id="back-to-list" class="back-button mobile-only" type="button" aria-label="Back to Messages">‹</button>
          <div class="chat-avatar" data-agent-initial>A</div>
          <div class="chat-heading"><strong data-agent-text="{agent}">Agent</strong><small id="chat-title">Your conversation</small></div>
          <div class="chat-actions">
            <span id="origin-badge" class="source-tag hidden"></span>
            <span id="presence" class="presence desktop-only"></span>
            <button class="theme-toggle theme-icon-only mobile-only" type="button" data-theme-toggle></button>
          </div>
        </header>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="message" data-agent-text="Message {agent}">Message the agent</label>
          <textarea id="message" rows="1" placeholder="Message the agent" data-agent-placeholder="Message {agent}" maxlength="16000" required></textarea>
          <button id="voice-button" class="mic-button" type="button" disabled aria-label="Voice messages are coming later" title="Voice messages are coming later"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
          <button id="send" class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
      </section>

      <section id="jobs-view" class="jobs-view hidden">
        <header class="jobs-header">
          <button id="back-to-jobs" class="back-button mobile-only" type="button" aria-label="Back to Jobs">‹</button>
          <div class="jobs-heading"><strong id="job-detail-title">Jobs</strong><small id="job-detail-subtitle">Scheduled work</small></div>
          <div class="jobs-actions"><button class="theme-toggle theme-icon-only mobile-only" type="button" data-theme-toggle></button></div>
        </header>
        <div id="job-detail" class="job-detail"></div>
        <div id="job-detail-actions" class="job-detail-actions hidden">
          <button id="run-selected-job" class="secondary" type="button">Run now</button>
          <button id="edit-selected-job" class="primary" type="button">Edit job</button>
        </div>
      </section>

      <section id="settings-view" class="jobs-view hidden">
        <header class="jobs-header">
          <button id="back-to-settings" class="back-button mobile-only" type="button" aria-label="Back to Settings">‹</button>
          <div class="jobs-heading"><strong id="settings-title">Settings</strong><small id="settings-subtitle"></small></div>
        </header>
        <div id="settings-detail" class="job-detail settings-detail"></div>
      </section>
    </main>

    <nav id="mobile-tabbar" class="mobile-tabbar mobile-only" aria-label="Sections">
      <button id="mobile-nav-messages" class="tab active" type="button"><span aria-hidden="true">▤</span>Messages</button>
      <button id="mobile-nav-jobs" class="tab" type="button"><span aria-hidden="true">◷</span>Jobs</button>
    </nav>
  </div>

  <dialog id="job-dialog" class="job-dialog">
    <form id="job-form">
      <div class="dialog-heading"><h2 id="job-dialog-title">New job</h2><button id="close-dialog" class="icon-button" type="button" aria-label="Close">×</button></div>
      <label for="job-name">Name</label><input id="job-name" maxlength="500" required placeholder="Morning briefing">
      <label for="job-prompt" data-agent-text="What should {agent} do?">What should the agent do?</label><textarea id="job-prompt" rows="5" maxlength="16000" required placeholder="Give me a clear overview of today's priorities."></textarea>
      <label for="job-schedule">Schedule</label><input id="job-schedule" maxlength="500" required placeholder="0 8 * * *"><p id="job-schedule-preview" class="field-help">Example: 0 8 * * * runs daily at 8:00.</p>
      <label for="job-deliver">Delivery</label><input id="job-deliver" maxlength="500" value="local" required><p class="field-help">“local” saves the result in Hermes.</p>
      <div id="job-management" class="job-management hidden"><button id="delete-job" class="danger" type="button">Delete job</button></div>
      <div class="dialog-actions"><button id="cancel-job" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Save</button></div>
    </form>
  </dialog>
  <dialog id="conversation-sheet" class="sheet" aria-labelledby="sheet-title">
    <div id="sheet-actions" class="sheet-view">
      <p id="sheet-title" class="sheet-title" tabindex="-1" autofocus></p>
      <button id="sheet-rename" class="sheet-action" type="button">Rename</button>
      <button id="sheet-delete" class="sheet-action danger-text" type="button">Delete</button>
      <button id="sheet-cancel" class="sheet-action sheet-cancel" type="button">Cancel</button>
    </div>
    <form id="sheet-rename-form" class="sheet-view hidden">
      <label class="sheet-title" for="sheet-name">Rename conversation</label>
      <input id="sheet-name" maxlength="200" autocomplete="off">
      <p id="sheet-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button id="sheet-rename-cancel" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Save</button></div>
    </form>
    <div id="sheet-confirm" class="sheet-view hidden">
      <p id="sheet-confirm-title" class="sheet-title" tabindex="-1"></p>
      <p class="sheet-note"><span data-agent-text="This removes the conversation from {agent}’s history for good.">This removes the conversation from the agent’s history for good.</span></p>
      <p id="sheet-confirm-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button id="sheet-confirm-cancel" class="secondary" type="button">Cancel</button><button id="sheet-confirm-delete" class="danger-button" type="button">Delete</button></div>
    </div>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
