name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the public repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history, so the content guard also scans earlier commits and their identities.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Roost in an isolated environment
        run: |
          python3 -m venv /tmp/roost
          /tmp/roost/bin/python -m pip install -e .
      - name: Check public content, links and tests
        run: make PYTHON=/tmp/roost/bin/python check
      - name: Run the demo smoke check
        run: make PYTHON=/tmp/roost/bin/python smoke
